<div class="row">
  {% for property in featured_properties %}
  <div class="col-lg-4 col-md-6 mb-4">
    <div class="card h-100 border-0 shadow-sm property-card rounded-4">
      <div class="position-relative">
        <img
          src="{{ property.image_url|default:'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=600' }}"
          class="card-img-top rounded-top-4"
          alt="Property Image"
          style="width: 100%; height: 220px; object-fit: cover;"
        />
        <span class="badge bg-success badge-featured">Featured</span>

        <!-- Wishlist Button -->
        <button 
          class="btn {% if property.in_wishlist %}btn-danger{% else %}btn-outline-secondary{% endif %} 
                 btn-sm position-absolute top-0 end-0 m-2 wishlist-btn"
          data-id="{{ property.id }}"
          onclick="toggleSave(event, {{ property.id }})">
          {% if property.in_wishlist %}
            <i class="fas fa-heart"></i>
          {% else %}
            <i class="far fa-heart"></i>
          {% endif %}
        </button>

        <span class="price-tag">₹{{ property.price }}/mo</span>
      </div>
      <div class="card-body">
        <h5 class="card-title">{{ property.title }}</h5>
        <p class="card-text text-muted">{{ property.description|truncatewords:15 }}</p>
        <div class="property-meta mb-3 d-flex justify-content-between">
          <div class="text-center">
            <i class="fas fa-bed"></i>
            <small>{{ property.bedrooms }} Beds</small>
          </div>
          <div class="text-center">
            <i class="fas fa-bath"></i>
            <small>{{ property.bathrooms }} Baths</small>
          </div>
          <div class="text-center">
            <i class="fas fa-ruler-combined"></i>
            <small>{{ property.area }} Sqft</small>
          </div>
        </div>
        <div class="d-flex justify-content-between">
          <a href="/property/{{ property.id }}" class="btn btn-outline-primary btn-sm flex-grow-1 me-2">
            <i class="fas fa-eye me-1"></i> View Details
          </a>
          <a href="/book/{{ property.id }}" class="btn btn-outline-primary btn-sm flex-grow-1 me-2 book-now-btn">
            Book Now
          </a>
        </div>
      </div>
      <div class="card-footer bg-white border-0">
        <small class="text-muted">
          <i class="fas fa-map-marker-alt me-1"></i>
          {{ property.location }}
        </small>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<script>
function toggleSave(e, propertyId) {
  e.preventDefault();
  const button = e.currentTarget;
  const icon = button.querySelector('i');
  const isSaved = icon.classList.contains('fas');

  // Toggle instantly for feedback
  if (isSaved) {
    icon.classList.remove('fas');
    icon.classList.add('far');
    button.classList.remove('btn-danger');
    button.classList.add('btn-outline-secondary');
  } else {
    icon.classList.remove('far');
    icon.classList.add('fas');
    button.classList.remove('btn-outline-secondary');
    button.classList.add('btn-danger');
  }

  fetch(`/wishlist/toggle/${propertyId}/`, {
    method: 'POST',
    headers: {
      'X-CSRFToken': getCookie('csrftoken'),
      'Content-Type': 'application/json',
    },
  })
  .then(response => response.json())
  .then(data => {
    if (data.status === 'added') {
      icon.classList.remove('far');
      icon.classList.add('fas');
      button.classList.remove('btn-outline-secondary');
      button.classList.add('btn-danger');
    } else if (data.status === 'removed') {
      icon.classList.remove('fas');
      icon.classList.add('far');
      button.classList.remove('btn-danger');
      button.classList.add('btn-outline-secondary');
    }
  })
  .catch(error => {
    console.error('Error toggling wishlist:', error);
  });
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
